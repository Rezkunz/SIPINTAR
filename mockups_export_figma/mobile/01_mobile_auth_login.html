<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Mobile — Masuk (Login) — SIPINTAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --brand-primary: #0D5C46;
    --brand-emerald: #10B981;
    --brand-accent: #D97706;
    --bg-page: #F8FAFC;
    --text-heading: #0F172A;
    --text-body: #334155;
    --text-muted: #64748B;
    --radius-pill: 9999px;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background-color: #E2E8F0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px 0;
}

/* Device Screen Frame: 390px x 844px (Standard iPhone/Android) */
.mobile-device-screen {
    width: 390px;
    min-height: 844px;
    background: #FFFFFF;
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.3), 0 0 0 10px #0F172A;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* Mobile Status Bar */
.mobile-status-bar {
    height: 44px;
    background: #094736;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 700;
}

/* Artwork Header Wave */
.mobile-auth-header {
    background: linear-gradient(155deg, #094736 0%, #0D5C46 50%, #10B981 100%);
    padding: 28px 24px 44px;
    color: #FFFFFF;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.mobile-artwork-waves {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0.2;
}

.auth-brand-logo-badge {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    background: #FFFFFF;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    position: relative;
    z-index: 2;
}

.auth-brand-title {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    position: relative;
    z-index: 2;
}

.auth-brand-title span {
    color: #FBBF24;
}

.auth-brand-sub {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 3px;
    font-weight: 600;
    position: relative;
    z-index: 2;
}

/* Form Sheet (Floating up with rounded corners) */
.mobile-auth-body {
    flex: 1;
    background: #FFFFFF;
    border-radius: 30px 30px 0 0;
    margin-top: -24px;
    padding: 30px 24px 24px;
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.auth-intro {
    text-align: center;
    margin-bottom: 22px;
}

.auth-heading {
    font-size: 22px;
    font-weight: 800;
    color: var(--brand-primary);
    margin-bottom: 4px;
}

.auth-subheading {
    font-size: 12.5px;
    color: var(--text-muted);
}

.auth-form-group {
    margin-bottom: 15px;
}

.auth-form-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-heading);
    margin-bottom: 6px;
    padding-left: 12px;
}

.auth-form-input {
    width: 100%;
    height: 48px;
    padding: 0 18px;
    background: #F0FDF4;
    border: 1.5px solid #DCFCE7;
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: 13.5px;
    color: var(--text-heading);
    outline: none;
}

.auth-input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}

.auth-btn-submit {
    width: 100%;
    height: 48px;
    border-radius: var(--radius-pill);
    background: linear-gradient(135deg, #0D5C46 0%, #10B981 100%);
    color: #FFFFFF;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(13, 92, 70, 0.25);
    margin-top: 10px;
}

.auth-footer-prompt {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-top: 20px;
}

.auth-footer-prompt a {
    color: var(--brand-primary);
    font-weight: 700;
    text-decoration: none;
    margin-left: 4px;
}

/* Home Indicator Bar */
.mobile-home-indicator {
    width: 134px;
    height: 5px;
    background: #0F172A;
    border-radius: 99px;
    margin: 18px auto 8px;
}
    </style>
</head>
<body>

    <div class="mobile-device-screen">
        <!-- STATUS BAR -->
        <div class="mobile-status-bar">
            <span>09:41</span>
            <div style="display: flex; gap: 6px; align-items: center;">
                <span>5G</span>
                <span>100%</span>
            </div>
        </div>

        <!-- HEADER ARTWORK -->
        <div class="mobile-auth-header">
            <svg class="mobile-artwork-waves" viewBox="0 0 400 200" fill="none">
                <path d="M-20 60 C120 140 280 20 420 80 L420 200 L-20 200 Z" fill="#FFFFFF"/>
            </svg>

            <div class="auth-brand-logo-badge">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0D5C46" stroke-width="2.3">
                    <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v4M12 14v4M16 14v4"/>
                </svg>
            </div>
            <h1 class="auth-brand-title">SIP<span>INTAR</span></h1>
            <div class="auth-brand-sub">Bank Mini Sekolah Digital</div>
        </div>

        <!-- FORM CONTENT SHEET -->
        <div class="mobile-auth-body">
            <div>
                <div class="auth-intro">
                    <h2 class="auth-heading">Selamat Datang</h2>
                    <p class="auth-subheading">Masuk untuk mengelola tabungan sekolah</p>
                </div>

                <form onsubmit="return false;">
                    <div class="auth-form-group">
                        <label class="auth-form-label">Nomor WhatsApp / NISN</label>
                        <input type="text" class="auth-form-input" value="081234567890">
                    </div>

                    <div class="auth-form-group">
                        <label class="auth-form-label">Kata Sandi</label>
                        <div class="auth-input-wrapper">
                            <input type="password" class="auth-form-input" value="••••••••••••">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
                        <a href="#" style="font-size: 12px; color: #64748B; text-decoration: none;">Lupa sandi?</a>
                    </div>

                    <button type="button" class="auth-btn-submit">Masuk ke Akun</button>

                    <div class="auth-footer-prompt">
                        Belum punya rekening?
                        <a href="02_mobile_auth_register.html">Buka Rekening</a>
                    </div>
                </form>
            </div>

            <!-- HOME BAR -->
            <div class="mobile-home-indicator"></div>
        </div>
    </div>

</body>
</html>
